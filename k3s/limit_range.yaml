apiVersion: v1
kind: LimitRange
metadata:
  name: code-executor-limits
  namespace: code-runner-env
spec:
  limits:
    - max:
        cpu: "1000m"
        memory: "1Gi"
      min:
        cpu: "10m"
        memory: "16Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      type: Container